name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android
          components: rustfmt
      - name: Install Android packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Check resources
        run: python3 scripts/check-resources.py
      - name: Test Rust
        run: |
          cargo fmt --manifest-path native/rust/Cargo.toml --check
          cargo test --manifest-path native/rust/Cargo.toml --locked
      - name: Build and check Android
        run: ./scripts/build-android.sh :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
