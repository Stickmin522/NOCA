 const initialHistory=()=>[{type:'train',route:'���� �� �i��',date:'10/15',delta:-220,balance:2450},{type:'shop',date:'10/15',delta:-180,balance:2670},{type:'topup',date:'10/14',delta:2000,balance:2850},{type:'train',route:'��� �� ���V',date:'10/14',delta:null,balance:850}];
 root.querySelectorAll('[data-design]').forEach(phone=>{

  const t=()=>words[state.lang];
  const money=n=>new Intl.NumberFormat(state.lang==='ja'?'ja-JP':state.lang==='en'?'en-US':'zh-CN').format(n);
  const current=()=>state.cards.find(c=>c.id===state.selected)||state.transient;
  const balance=c=>`<span class="ic-currency">��</span>${money(c.balance)}`;
  const button=(a,label,ico,cls='ic-primary')=>`<button type="button" class="${cls} cursor-interaction" data-action="${a}">${ico?icon(ico):''}<span>${esc(label)}</span></button>`;
  function history(c,limit=4){const w=t();return `<div class="ic-history"><div class="ic-headrow"><span class="ic-section-label">${w.history}</span><span class="ic-small">${c.history.length} ${state.lang==='en'?'records':state.lang==='ja'?'��':'��'}</span></div>${c.history.slice(0,limit).map(h=>`<div class="ic-history-item"><span class="ic-history-icon">${icon(h.type==='train'?'train-front':h.type==='shop'?'shopping-bag':'plus')}</span><div class="ic-history-info"><div class="ic-history-title">${h.type==='train'?esc(h.route):w[h.type]}</div><div class="ic-history-meta">${h.date} �� ${h.type==='shop'?w.noShop:w[h.type]}</div></div><div class="ic-history-amount ${h.delta>0?'is-positive':''}">${h.delta==null?'��':`${h.delta>0?'+':'?'}��${money(Math.abs(h.delta))}`}<small>${w.yen} ��${money(h.balance)}</small></div></div>`).join('')}</div>`}
  function scanRow(){const w=t();return `<button type="button" class="ic-scan-row cursor-interaction" data-action="scan" aria-label="${esc(w.read)}">${icon('nfc')}<span><span class="ic-scan-label">${state.reading?(state.lang==='ja'?'�i��ȡ���С�':state.lang==='en'?'Reading��':'���ڶ�ȡ��'):w.read}</span><span class="ic-scan-hint">${w.sub}</span></span>${icon('arrow-up-right','ic-arrow')}</button>`}
  function home(){const w=t(),c=state.cards[0];
   if(design==='noka')return `<div class="ic-eyebrow">JAPAN TRANSIT CARDS</div><div class="ic-title">${w.headline.replace('\n','<br>')}</div><p class="ic-subtitle">${w.sub}</p><button type="button" class="ic-hero cursor-interaction ${state.reading?'ic-reading':''}" data-action="scan" aria-label="${esc(w.read)}"><span class="ic-ready">${w.ready}</span><span class="ic-orb">${icon('nfc')}</span><span class="ic-scan-label">${state.reading?(state.lang==='en'?'Reading��':state.lang==='ja'?'�i��ȡ���С�':'���ڶ�ȡ��'):w.waiting}</span><span class="ic-scan-hint">${w.hint}</span><span class="ic-hero-decoration"></span></button><div class="ic-headrow"><span class="ic-section-label">${w.recent}</span><button type="button" class="ic-textbutton cursor-interaction" data-action="wallet">${w.all}${icon('chevron-right')}</button></div><button type="button" class="ic-recent ic-soft cursor-interaction" data-open="p">${img(c.art,'ic-miniart')}<div class="ic-recent-info"><div class="ic-name">${esc(c.name)}</div><div class="ic-small">${c.read}</div><div class="ic-balance-small">��${money(c.balance)}</div></div>${icon('arrow-up-right')}</button><div class="ic-bottom-note">${icon('lock-keyhole')}${w.local}</div>`;
   if(design==='kasane')return `<div class="ic-eyebrow">YOUR EVERYDAY CARDS</div><div class="ic-title">${w.cardIntro.replace('\n','<br>')}</div><p class="ic-subtitle">${w.deckSub}</p><button type="button" class="ic-deck cursor-interaction" data-open="p" aria-label="${esc(c.name)}">${img('PASMO')}</button><div class="ic-ledger ic-inset"><div><div class="ic-small">${esc(c.name)}</div><div class="ic-balance-small">��${money(c.balance)}</div></div><div style="text-align:right"><div class="ic-small">${w.last}</div><div class="ic-small">10/15 14:35</div></div></div>${scanRow()}<div class="ic-headrow" style="margin-top:15px"><span class="ic-small">${state.cards.length} ${w.count}</span><button type="button" class="ic-textbutton cursor-interaction" data-action="wallet">${w.all}${icon('arrow-right')}</button></div><div class="ic-bottom-note">${icon('lock-keyhole')}${w.local}</div>`;
   return `<div class="ic-eyebrow">IC CARD COMPANION</div><div class="ic-title">${w.sumiTitle}</div><p class="ic-subtitle">${w.sumiSub}</p><button type="button" class="ic-ticket cursor-interaction" data-open="p" style="width:100%"><div class="ic-ticket-top"><span class="ic-name">${esc(c.name)}</span><span class="ic-small">${w.recent}</span></div><div class="ic-balance">${balance(c)}</div><div class="ic-ticket-bottom"><span>PASMO</span><span>10/15 �� 14:35 ${icon('arrow-up-right')}</span></div></button>${scanRow()}<div class="ic-headrow" style="margin-top:17px"><span class="ic-section-label">${w.latest}</span><button type="button" class="ic-textbutton cursor-interaction" data-action="wallet">${w.all}${icon('chevron-right')}</button></div>${history(c,1).replace(/<div class="ic-headrow">.*?<\/div>/,'')}<div class="ic-bottom-note">${icon('lock-keyhole')}${w.local}</div>`;
  }
  function detail(){const w=t(),c=current(),saved=state.cards.some(x=>x.id===c.id);return `${state.notice?`<div class="ic-sync-toast" role="status">${icon('circle-check')}${w.sync}</div>`:''}<div class="ic-detail-head"><span class="ic-tag">${icon(saved?'bookmark-check':'circle-check')}${saved?w.saved:w.readok}</span><div class="ic-title" style="font-size:26px;margin-top:14px">${esc(c.name||w.newcard)}</div></div><div class="ic-balancebox ic-soft">${img(c.art,'ic-miniart')}<div class="ic-small">${w.bal}</div><div class="ic-balance">${balance(c)}</div><div class="ic-small">${w.last} ${c.read}</div></div><div class="ic-actions">${button('scan',w.rescan,'nfc','ic-secondary')}${saved?button('edit',w.edit,'sliders-horizontal'):button('remember',w.remember,'bookmark-plus')}</div>${history(c)}<div class="ic-disclaimer">${w.estimate}</div>`}
  function wallet(){const w=t();return `<div class="ic-eyebrow">YOUR COLLECTION</div><div class="ic-title">${w.mycards}</div><p class="ic-subtitle">${w.cardsub}</p>${state.cards.map(c=>`<button type="button" class="ic-wallet-item ic-soft cursor-interaction" data-open="${c.id}">${img(c.art)}<div class="ic-wallet-info"><div class="ic-name">${esc(c.name)}</div><div class="ic-balance-small">��${money(c.balance)}</div><div class="ic-small">${w.last} ${c.read}</div></div></button>`).join('')}<div class="ic-bottom-note">${icon('nfc')}${w.privacy}</div>`}
  function settings(){const w=t();return `<div class="ic-eyebrow">PERSONAL PREFERENCES</div><div class="ic-title">${w.settings}</div><p class="ic-subtitle">${names[design]} �� ${w.local}</p><div class="ic-settings-group"><label class="ic-setting-row">${icon('languages')}<span class="ic-setting-copy"><span class="ic-name" style="display:block">${w.language}</span><span class="ic-small">${w.langDesc}</span></span><select data-setting="language" aria-label="${w.language}"><option value="system" ${state.localeChoice==='system'?'selected':''}>${w.system}</option><option value="zh" ${state.localeChoice==='zh'?'selected':''}>��������</option><option value="ja" ${state.localeChoice==='ja'?'selected':''}>�ձ��Z</option><option value="en" ${state.localeChoice==='en'?'selected':''}>English</option></select></label><div class="ic-setting-row">${icon('type')}<span class="ic-setting-copy"><span class="ic-name" style="display:block">${w.font}</span><span class="ic-small">${w.fontDesc}</span></span><span class="ic-small" style="max-width:92px;text-align:right">${w.fontValue}</span></div></div><div class="ic-settings-group"><label class="ic-setting-row">${icon('sun-moon')}<span class="ic-setting-copy"><span class="ic-name" style="display:block">${w.appearance}</span></span><select data-setting="appearance" aria-label="${w.appearance}"><option value="system" ${state.appearance==='system'?'selected':''}>${w.mode}</option><option value="light" ${state.appearance==='light'?'selected':''}>${w.light}</option><option value="dark" ${state.appearance==='dark'?'selected':''}>${w.dark}</option></select></label></div>`}
  function edit(){const w=t(),c=current();return `<div class="ic-title" style="font-size:27px">${w.editTitle}</div><p class="ic-subtitle">${w.editSub}</p>${img(state.draftArt,'ic-edit-art')}<label class="ic-input-label" for="ic-name-${design}">${w.cardName}</label><input id="ic-name-${design}" data-edit-name class="ic-input ic-inset" maxlength="30" required value="${esc(state.draftName)}"><div class="ic-input-label">${w.art}</div><div class="ic-art-grid">${Object.keys(art).map(a=>`<button type="button" class="ic-art-option cursor-interaction" data-art="${a}" aria-pressed="${a===state.draftArt}">${img(a)}<span>${a}</span></button>`).join('')}</div>${button('saveEdit',w.save,'check')}<div class="ic-disclaimer">${w.artNote}</div>`}
  function modal(){const w=t();return `<div class="ic-scrim"><div class="ic-dialog" role="dialog" aria-modal="true" aria-labelledby="ic-dialog-title-${design}"><span class="ic-dialog-mark">${icon('bookmark-plus')}</span><h2 id="ic-dialog-title-${design}">${w.saveTitle}</h2><p>${w.saveDesc}</p><label class="ic-input-label" for="ic-save-name-${design}">${w.cardName}</label><input id="ic-save-name-${design}" class="ic-input ic-inset" data-save-name maxlength="30" placeholder="${w.placeholder}" value="${esc(state.saveName||'')}"><div class="ic-input-error" data-error role="alert"></div><div class="ic-actions">${button('cancelModal',w.cancel,null,'ic-secondary')}${button('saveCard',w.save,'check')}</div></div></div>`}
  function render(){const w=t();phone.dataset.appearance=state.appearance;phone.lang=state.lang;const sub=['detail','edit'].includes(state.page);phone.innerHTML=`<div class="ic-status"><span>3:31</span><span class="ic-status-right">${icon('signal')}${icon('wifi')}${icon('battery-full')}</span></div><header class="ic-appbar">${sub?`<button type="button" class="ic-iconbutton cursor-interaction" data-action="back" aria-label="${w.back}">${icon('arrow-left')}</button><span class="ic-section-label">${state.page==='edit'?w.edit:w.history}</span>`:`<div class="ic-brand"><span class="ic-brandmark">${icon(design==='kasane'?'layers-2':design==='sumi'?'scan-line':'nfc')}</span>${names[design]}</div>`}<button type="button" class="ic-iconbutton cursor-interaction" data-action="${sub?'settings':'appearance'}" aria-label="${sub?w.settings:w.appearance}">${icon(sub?'settings-2':state.appearance==='dark'?'moon':'sun')}</button></header><main class="ic-main" aria-live="polite">${state.page==='home'?home():state.page==='wallet'?wallet():state.page==='settings'?settings():state.page==='edit'?edit():detail()}</main><span class="ic-demo-badge">${w.sample}</span><nav class="ic-bottom" aria-label="${state.lang==='en'?'Main navigation':state.lang==='ja'?'�ᥤ��ʥӥ��`�����':'������'}">${['home','wallet','settings'].map((p,i)=>`<button type="button" class="cursor-interaction" data-action="${p}" ${state.page===p||p==='wallet'&&sub?'aria-current="page"':''}>${icon(['nfc','wallet-cards','settings-2'][i])}<span>${w[['scan','wallet','settings'][i]]}</span></button>`).join('')}</nav><div class="ic-homebar"></div>${state.modal?modal():''}`;if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20}});}
  async function scan(){if(state.reading)return;state.reading=true;state.notice=false;const selected=state.page==='detail'?current():null;render();await new Promise(r=>setTimeout(r,650));let c=selected||state.cards.find(x=>x.id==='s');if(c){const spend=c.id==='p'?210:140;c.balance-=spend;c.read='10/16 03:31';c.history.unshift({type:'train',route:'��� �� �@ľ�',date:'10/16',delta:-spend,balance:c.balance});state.selected=c.id;state.notice=true;}else{c={id:'s',brand:'Suica',art:'Suica',name:'',balance:2450,read:'10/16 03:31',history:initialHistory()};state.transient=c;state.selected='s';}state.page='detail';state.reading=false;render();}
  phone.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.open){state.selected=b.dataset.open;state.page='detail';state.notice=false;render();return;}if(b.dataset.art){state.draftName=phone.querySelector('[data-edit-name]').value;state.draftArt=b.dataset.art;render();return;}const a=b.dataset.action;if(!a)return;if(state.modal&&!['cancelModal','saveCard'].includes(a))return;if(a==='scan'){scan();return;}if(['home','wallet','settings'].includes(a)){state.page=a;state.notice=false;}if(a==='appearance'){state.appearance=state.appearance==='dark'?'light':'dark';}if(a==='remember'){state.modal=true;state.saveName='';}if(a==='cancelModal')state.modal=false;if(a==='saveCard'){const val=phone.querySelector('[data-save-name]').value.trim();if(!val){phone.querySelector('[data-error]').textContent=t().required;return;}const c=current();c.name=val;state.cards.push(c);state.transient=null;state.modal=false;}if(a==='edit'){state.draftName=current().name;state.draftArt=current().art;state.page='edit';}if(a==='saveEdit'){const val=phone.querySelector('[data-edit-name]').value.trim();if(!val){phone.querySelector('[data-edit-name]').reportValidity();return;}current().name=val;current().art=state.draftArt;state.page='detail';}if(a==='back'){state.page=state.page==='edit'?'detail':'wallet';}render();if(state.modal)phone.querySelector('[data-save-name]').focus();});
  phone.addEventListener('change',e=>{if(e.target.dataset.setting==='appearance'){state.appearance=e.target.value;render();}if(e.target.dataset.setting==='language'){state.localeChoice=e.target.value;state.lang=state.localeChoice==='system'?'zh':state.localeChoice;render();}});
  phone.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=false;render();}if(e.key==='Enter'&&e.target.matches('[data-save-name]'))phone.querySelector('[data-action="saveCard"]').click();});
  render();
 });
